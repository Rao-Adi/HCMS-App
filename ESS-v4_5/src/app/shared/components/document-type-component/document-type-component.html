<app-ag-grid-wrapper
  [gridStyle]="{ width: '100%', height: '250px' }"
  [columnDefs]="documentTypeColumnDefs"
  [defaultColDef]="defaultColDef"
  [rowData]="documentTypeData"
  [pageSize]="pageSize"
  [totalRows]="totalDocumentTypes"
  [pageSize]="selectedPageSize"
  gridId="documentTypeGrid"
  (pageSizeChange)="onPageSizeChanged($event)"

>
</app-ag-grid-wrapper>
