<app-ag-grid-wrapper
  [gridStyle]="{ width: '100%', height: '250px' }"
  [columnDefs]="divisionColumnDefs"
  [defaultColDef]="defaultColDef"
  [rowData]="divisionData"
  [totalRows]="totalDivisions"
  [pageSize]="selectedPageSize"
  gridId="divisionGrid"
  (pageSizeChange)="onPageSizeChanged($event)"
  (serverQuery)="getAllDivisions($event)"
>
</app-ag-grid-wrapper>
