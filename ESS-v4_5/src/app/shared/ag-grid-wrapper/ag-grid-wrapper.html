<ag-grid-angular
  class="ag-theme-alpine"
  [ngStyle]="gridStyle"
  [rowData]="rowData"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [context]="{ componentParent: this }"
  [pagination]="false"
  (gridReady)="onGridReady($event)"
  (sortChanged)="onSortChanged()"
  (filterChanged)="onFilterChanged()"
  (cellValueChanged)="onCellValueChanged($event)"
  (cellClicked)="onCellClicked($event)"
>
</ag-grid-angular>

<!-- Pagination Footer -->
<div class="ag-paging-panel">
  <div class="ag-paging-row-summary">
    Page {{ pageNumber }} of {{ totalPages }} ({{ totalRows }} rows)
  </div>

  <div class="ag-paging-controls">
    <button class="ag-paging-button" (click)="goToPage(1)" [disabled]="pageNumber === 1">«</button>

    <button
      class="ag-paging-button"
      (click)="goToPage(pageNumber - 1)"
      [disabled]="pageNumber === 1"
    >
      ‹
    </button>

    <button
      class="ag-paging-button"
      (click)="goToPage(pageNumber + 1)"
      [disabled]="pageNumber === totalPages"
    >
      ›
    </button>

    <button
      class="ag-paging-button"
      (click)="goToPage(totalPages)"
      [disabled]="pageNumber === totalPages"
    >
      »
    </button>

    <span class="ag-paging-page-size">
      <select [value]="pageSize" (change)="onPageSizeChange($any($event.target).value)">
        <option *ngFor="let s of pageSizeOptions" [value]="s">
          {{ s }}
        </option>
      </select>
    </span>
  </div>
</div>
