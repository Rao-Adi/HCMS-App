<!-- Top bar: search | actions from the parent | Display Options. A flex row that wraps: the search box is a fixed 250px and used to sit in a
     col-lg-2, which on a narrower screen is narrower than 250px, so the box spilled over the buttons next to it (Approve / Reject / ...
     appeared on top of the search bar). Now every part keeps its own room and the actions drop to the next line when they do not fit. -->
<div class="grid-top-row">
  <div class="grid-search-col">
    <div class="example-header">
      <input
        class="form-control"
        style="width: 250px"
        nz-input
        placeholder="Search"
        [(ngModel)]="searchValue"
        (ngModelChange)="onSearchModelChange($event)"
      />
    </div>
  </div>
  <div class="grid-actions-col">
    <!-- 🔹 ACTIONS FROM PARENT -->
    <ng-content select="[grid-actions]"></ng-content>
  </div>
  <div class="grid-toolbar-col">
    <div class="grid-toolbar">
      <button class="display-options-btn" (click)="toggleDisplayOptions()">
        <i nz-icon nzType="setting"></i>
        Display Options
      </button>
    </div>
  </div>
</div>
<!-- The Visible Columns panel sits under the bar, outside the flex row, so opening it does not move the Display Options button. -->
<div class="grid-options-row">
  <div class="display-options-panel" [class.open]="toggleShow">
    <div class="panel-header">
      <span>Visible Columns</span>

      <div class="toggle-all">
        <label class="switch">
          <input type="checkbox" [checked]="isAllSelected" (change)="toggleAllColumns($event)" />
          <span class="slider round"></span>
        </label>
        <span class="span mt-1">All</span>
      </div>
    </div>

    <div class="panel-body">
      <label class="column-chip" *ngFor="let col of columnToggles">
        <nz-switch
          nzSize="small"
          [(ngModel)]="col.visible"
          (ngModelChange)="toggleColumn(col, $event)"
          [nzDisabled]="!gridApi"
        ></nz-switch>
        <span>{{ col.label }}</span>
      </label>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12" style="position: relative;">
    <!-- suppressNoRowsOverlay is bound to isServerSide so exactly one empty-state message shows.
         This wrapper renders its own (see showNoRowsMessage) because AG Grid's overlay does not
         fire reliably for the infinite row model the server-paginated grids use -- but when it
         does fire, both appeared, printed on top of each other. A client-side grid has no message
         of its own here, so there AG Grid's overlay stays the only one. -->
    <ag-grid-angular
      class="ag-theme-alpine"
      [ngStyle]="finalGridStyle"
      [domLayout]="config.domLayout"
      [rowModelType]="isServerSide ? 'infinite' : 'clientSide'"
      [rowData]="isServerSide ? undefined : rowData"
      [gridOptions]="gridOptions"
      [columnDefs]="finalColumnDefs"
      [defaultColDef]="finalDefaultColDef"
      [localeText]="{ noRowsToShow: 'No data' }"
      [suppressNoRowsOverlay]="isServerSide"
      [cacheBlockSize]="pageSize"
      [context]="{ componentParent: this }"
      [pagination]="true"
      [rowHeight]="finalRowHeight"
      [headerHeight]="config.headerHeight"
      [paginationPageSize]="pageSize"
      [paginationPageSizeSelector]="pageSizeOptions"
      [suppressCellFocus]="config.suppressCellFocus"
      (gridReady)="onGridReady($event)"
      (sortChanged)="onSortChanged()"
      (filterChanged)="onFilterChanged()"
      (cellValueChanged)="onCellValueChanged($event)"
      (cellClicked)="onCellClicked($event)"
      (selectionChanged)="onSelectionChanged()"
      (rowSelected)="onRowSelected($event)"
      (paginationChanged)="onPaginationChanged($event)"
      (firstDataRendered)="onFirstDataRendered($event)"
      (rowDataUpdated)="onRowDataUpdated($event)"
      (gridSizeChanged)="onGridSizeChanged()"
    >
    </ag-grid-angular>
    <div
      class="ag-grid-empty-state"
      *ngIf="showNoRowsMessage"
      [style.top.px]="config.headerHeight"
      [style.height.px]="config.rowHeight || 47"
    >
      No data
    </div>
    <app-spinner *ngIf="isLoading"></app-spinner>
  </div>
</div>
