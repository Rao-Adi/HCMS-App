<div class="approval-table-wrapper">
  <!-- ================= VIEW MODE ================= -->

  <div *ngIf="isViewMode" class="mb-2">
    <input class="form-control" style="width: 250px" placeholder="Search" [value]="searchText" (input)="searchText = $any($event.target).value" />
  </div>
  <div *ngIf="isViewMode" class="dms-popup-table-wrap">
    <table class="approval-table dms-popup-table">
      <thead>
        <tr>
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'name'" (click)="sortBy('name')">Name<i class="bi" [ngClass]="icon('name')"></i></th>
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'role'" (click)="sortBy('role')">Role<i class="bi" [ngClass]="icon('role')"></i></th>
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'designation'" (click)="sortBy('designation')">Designation<i class="bi" [ngClass]="icon('designation')"></i></th>
          <!-- <th>Division</th> -->
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'observation'" (click)="sortBy('observation')">Observation<i class="bi" [ngClass]="icon('observation')"></i></th>
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'action'" (click)="sortBy('action')">Last Action Performed<i class="bi" [ngClass]="icon('action')"></i></th>
          <th class="dms-th-sort" [class.is-sorted]="sort.key === 'on'" (click)="sortBy('on')">Last Action Performed On<i class="bi" [ngClass]="icon('on')"></i></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of shownObservations">
          <td class="emp">{{ o.EmployeeName }}</td>
          <td>{{ o.roleName }}</td>
          <td class="obs">{{ o.Designation }}</td>
          <!-- <td class="obs">{{ o.Division }}</td> -->
          <td class="obs" [innerHTML]="o.Observation"></td>
          <td>
            <!-- Same shared source as every other status in the product. -->
            <span class="dms-status-pill" [ngClass]="statusClass(o.Decision)">
              {{ statusLabel(o.Decision) }}
            </span>
          </td>
          <td class="audit-cell dms-dt">{{ o.ActionAt | dtLines }}</td>
        </tr>
        <tr *ngIf="shownObservations.length === 0">
          <td colspan="6" class="text-center text-muted">No data</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ================= INPUT MODE ================= -->

  <div *ngIf="isInputMode">
    <form [formGroup]="form">
      <!-- <div class="mb-2">
        <label
          ><b>{{ modalData.action }} Observation</b></label
        >
      </div> -->

      <!-- <textarea
        rows="5"
        class="form-control"
        formControlName="observation"
        placeholder="Enter your observation here"
      >
      </textarea> -->
      <div class="editor">
        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>
        <ngx-editor [editor]="editor" formControlName="observation" [disabled]="IsReadyOnly">
        </ngx-editor>
      </div>

      <div
        class="text-danger mt-1"
        *ngIf="form.get('observation')?.touched && form.get('observation')?.hasError('required')"
      >
        Observation is required
      </div>

      <div class="row mt-4 pb-3">
        <div class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-center align-items-center gap-3">
          <button
            type="button"
            tabindex="0"
            class="btn btn-primary shadow-sm"
            style="width: 140px !important; height: 35px !important;"
            [disabled]="loading"
            (click)="submit()"
          >
            <span
              class="spinner-border spinner-border-sm me-2"
              role="status"
              aria-hidden="true"
              *ngIf="loading"
            ></span>
            <i class="bi bi-file-earmark-text me-2" *ngIf="!loading"></i>
            Submit
          </button>
          <button
            type="button"
            tabindex="0"
            class="btn btn-secondary shadow-sm"
            style="width: 160px !important; height: 35px !important;"
            [disabled]="loading"
            (click)="saveDraft()"
          >
            <span
              class="spinner-border spinner-border-sm me-2"
              role="status"
              aria-hidden="true"
              *ngIf="loading"
            ></span>
            <i class="bi bi-save me-2" *ngIf="!loading"></i>
            Save Observation
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
