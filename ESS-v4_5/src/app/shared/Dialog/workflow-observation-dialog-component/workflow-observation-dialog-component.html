<div class="approval-table-wrapper">
  <!-- ================= VIEW MODE ================= -->

  <div *ngIf="isViewMode" class="approval-table">
    <table class="approval-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Department</th>
          <th>Division</th>
          <th>Observation</th>
          <th>Last Action Performed</th>
          <th>Last Action Performed On</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of observations">
          <td class="emp">{{ o.EmployeeName }}</td>
          <td>{{ o.roleName }}</td>
          <td class="obs">{{ o.Department }}</td>
          <td class="obs">{{ o.Division }}</td>
          <td class="obs" [innerHTML]="o.Observation"></td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                approve: o.Decision === 'Approved',
                reject: o.Decision === 'Rejected' || o.Decision === 'Reworked'
              }"
            >
              {{ o.Decision }}
            </span>
          </td>
          <td>{{ o.ActionAt }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ================= INPUT MODE ================= -->

  <div *ngIf="isInputMode">
    <form [formGroup]="form">
      <!-- <div class="mb-2">
        <label
          ><b>{{ modalData.action }} Observation</b></label
        >
      </div> -->

      <!-- <textarea
        rows="5"
        class="form-control"
        formControlName="observation"
        placeholder="Enter your observation here"
      >
      </textarea> -->
      <div class="editor">
        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>
        <ngx-editor [editor]="editor" formControlName="observation" [disabled]="IsReadyOnly">
        </ngx-editor>
      </div>

      <div
        class="text-danger mt-1"
        *ngIf="form.get('observation')?.touched && form.get('observation')?.hasError('required')"
      >
        Observation is required
      </div>

      <div class="mt-3 text-end d-flex">
        <!-- <button class="btn btn-secondary me-2" type="button" (click)="close()">Cancel</button> -->

        <button class="btn btn-primary" type="button" (click)="submit()">Submit</button>
      </div>
    </form>
  </div>
</div>
