<div class="approval-table-wrapper" style="position: relative; min-height: 120px">
  <app-spinner *ngIf="loading"></app-spinner>
  <table class="approval-table">
    <thead>
      <tr>
        <th>Approval sequence</th>
        <th>Employee Approval Authority</th> 
        <th>Received On</th>
        <th>Status updated on</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let h of workflowHistory">
        <td>{{ h.StepOrder }}</td>

        <td class="emp">
          {{ h.EmployeeName || '—' }}
        </td> 
        
        <td class="audit-cell">
          {{ h.ReceivedOn }}
        </td>
        <td class="audit-cell">
          {{ h.StatusUpdatedOn }}
        </td>

        <td>
          <span
            class="badge"
            [ngClass]="{
              approve: h.Decision === 'Approved',
              reject: h.Decision === 'Rejected',
              pending: h.Decision === 'Reworked' || !h.Decision
            }"
          >
            <!-- DB/backend value is 'Reworked' -- client-facing label is "Reverted". -->
            {{ h.Decision === 'Reworked' ? 'Reverted' : (h.Decision || 'Pending') }}
          </span>
        </td>
      </tr>
      <tr *ngIf="!loading && (!workflowHistory || workflowHistory.length === 0)">
        <td colspan="5" class="text-center">No records to show.</td>
      </tr>
    </tbody>
  </table>
</div>
