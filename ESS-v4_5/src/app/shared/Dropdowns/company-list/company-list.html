<nz-select
  [style.width]="width"
  [(ngModel)]="value"
  [nzPlaceHolder]="placeholder"
  [nzAllowClear]="allowClear"
  [nzShowSearch]="showSearch" 
  (ngModelChange)="onSelectionChange($event)"
>
  <nz-option *ngFor="let item of data" [nzValue]="item.ID" [nzLabel]="item.NAME"></nz-option>
</nz-select>
