<nz-select
  [style.width]="width"
  [ngModel]="value"
  [nzPlaceHolder]="placeholder"
  [nzAllowClear]="allowClear"
  [nzShowSearch]="showSearch"
  [nzDisabled]="disabled"
  (ngModelChange)="onSelectionChange($event)"
>
<nz-option
  *ngFor="let item of DocTypeData"
  [nzValue]="$any(item)[valueKey]"
  [nzLabel]="$any(item)[labelKey]"
></nz-option>

</nz-select>
