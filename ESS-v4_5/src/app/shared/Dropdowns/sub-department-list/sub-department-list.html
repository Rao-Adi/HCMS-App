<nz-select
  [nzLoading]="isLoading"
  [style.width]="width"
  [(ngModel)]="value"
  [nzPlaceHolder]="placeholder"
  [nzAllowClear]="allowClear"
  [nzShowSearch]="showSearch"
  [nzDisabled]="disabled"
  (ngModelChange)="onSelectionChange($event)"
>
  <nz-option *ngFor="let item of subDepartmentData" [nzValue]="item.CODE" [nzLabel]="item.NAME"></nz-option>
</nz-select>
