<div *ngIf="attributes.length > 0">
  <form *ngIf="form" [formGroup]="form">
    <div class="status-box-leftColmd6-standard">
      <div class="PnlHeading">
        <h3 class="PnlHeader">Document Attributes</h3>
      </div>
      <div class="row">
        <div *ngFor="let attr of attributes" class="col-12 col-md-6 col-lg-4 mb-4 px-3">
          <div class="form-group">
            <!-- LABEL -->
            <div class="PnlHeading">
              <label class="ctrllbl text-uppercase">
                {{ attr.ControlLabel }}
                <span *ngIf="attr.IsMandatory && mode === 'create'" class="text-danger">*</span>
              </label>
            </div>

            <div class="w-100 mt-2">
              <ng-container [ngSwitch]="attr.ControlType">
                <!-- DATE -->
                <nz-date-picker
                  *ngSwitchCase="'date'"
                  style="width: 50%"
                  [formControlName]="'ctrl_' + attr.Id"
                  [nzDisabled]="mode === 'view'"
                ></nz-date-picker>

                <!-- TEXTBOX -->
                <input
                  *ngSwitchCase="'textbox'"
                  type="text"
                  [ngClass]="{
                    'form-control': true,
                    'input-sm': true,
                    'w-50': true
                  }"
                  [formControlName]="'ctrl_' + attr.Id"
                  [readonly]="mode === 'view'"
                />

                <!-- NUMERIC -->
                <input
                  *ngSwitchCase="'numeric'"
                  type="number"
                  [ngClass]="{
                    'form-control': true,
                    'input-sm': true,
                    'w-50': true
                  }"
                  [formControlName]="'ctrl_' + attr.Id"
                  [readonly]="mode === 'view'"
                />

                <!-- TEXTAREA -->
                <textarea
                  *ngSwitchCase="'textarea'"
                  rows="3"
                  [ngClass]="{
                    'form-control': true,
                    'input-sm': true,
                    'w-50': true
                  }"
                  [formControlName]="'ctrl_' + attr.Id"
                  [readonly]="mode === 'view'"
                >
                </textarea>

                <!-- DROPDOWN -->
                <nz-select
                  *ngSwitchCase="'list'"
                  style="width: 50%"
                  nzPlaceHolder="Select"
                  nzAllowClear
                  nzShowSearch
                  [formControlName]="'ctrl_' + attr.Id"
                  [nzAllowClear]="mode !== 'view'"
                  [nzShowSearch]="mode !== 'view'"
                >
                  <nz-option
                    *ngFor="let option of attr.options"
                    [nzValue]="option"
                    [nzLabel]="option"
                  >
                  </nz-option>
                </nz-select>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="row">
      <div class="col-sm-12 col-md-12 col-lg-12">
        <h3 class="PnlHeader">
          {{ 'labels.Document Content' | safeTranslate }}
        </h3>
        <br />

        <app-dmsrich-text-edit
          formControlName="documentContent"
          [editorStyle]="{ width: '100%', height: '350px' }"
          [IsReadyOnly]="true"
          [contentHtml]="documentContentHTML"
          (contentHtmlChange)="templateHtml = $event"
        ></app-dmsrich-text-edit>
      </div>
    </div> -->
    </div>
  </form>
</div>
