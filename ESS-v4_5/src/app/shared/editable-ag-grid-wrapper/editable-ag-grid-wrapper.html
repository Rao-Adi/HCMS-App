<div class="row mb-2" *ngIf="showSearchBar">
  <div class="col-sm-3">
    <div class="example-header">
      <div class="PnlHeading">
        <label>{{ 'labels.Search' | safeTranslate }}</label>
      </div>
      <input
        nz-input
        style="border-radius: 5px"
        placeholder="Search"
        [value]="value()"
        (input)="onFilterTextBoxChanged($event)"
        [value]="value()"
        (input)="onFilterTextBoxChanged($event)"
      />
    </div>
  </div>
</div>

<!-- Relative, so the empty-state message below can be positioned against the grid. -->
<div class="grid-host">
<ag-grid-angular
  [gridId]="gridId"
  [ngStyle]="finalGridStyle"
  [domLayout]="config.domLayout"
  [class]="config.theme || 'ag-theme-alpine'"
  [rowData]="rowData"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [localeText]="{ noRowsToShow: 'No records to show.' }"
  [suppressNoRowsOverlay]="true"
  [rowHeight]="config.rowHeight"
  [headerHeight]="config.headerHeight"
  [pagination]="config.enablePagination"
  [context]="gridContext"
  [paginationPageSize]="config.pageSize"
  [paginationPageSizeSelector]="config.pageSizeOptions"
  [suppressCellFocus]="config.suppressCellFocus"
  [pinnedTopRowData]="pinnedTopRowData"
  [pinnedBottomRowData]="pinnedBottomRowData"
  [rowSelection]="config.enableSelection ? 'multiple' : undefined"
  (gridReady)="onGridReady($event)"
  (rowEditingStopped)="handleRowEditingStopped($event)"
  (cellClicked)="onCellClicked($event)"
  (selectionChanged)="onSelectionChanged($event)"
  (filterChanged)="refreshGrid()"
  (onCellValueChanged)="onCellValueChanged($event)"
  (firstDataRendered)="onFirstDataRendered($event)"
  (rowDataUpdated)="onRowDataUpdated($event)"
>
</ag-grid-angular>

  <!-- AG Grid's own no-rows overlay is centred over the whole body area, which on this grid
       includes the pinned top row that carries the add/filter line -- so with no data the message
       printed straight on top of that row's "--any--" text. Positioned here instead, at exactly
       the first empty row's offset (header + however many pinned rows there are), so it lands in
       the empty band below them where a first row would have been. -->
  <div
    class="ag-grid-empty-state"
    *ngIf="showNoRowsMessage"
    [style.top.px]="emptyStateTop"
    [style.height.px]="config.rowHeight || 47"
  >
    No records to show.
  </div>
</div>
