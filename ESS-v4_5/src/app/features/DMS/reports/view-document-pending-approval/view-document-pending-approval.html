<!-- Document Content Modal Template -->
<ng-template #documentModalTpl>
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <!-- PDF iframe viewer -->
      <ng-container *ngIf="isPdf && safeDraftFileUrl">
        <iframe
          [src]="safeDraftFileUrl"
          width="100%"
          height="600px"
          style="border: none; border-radius: 8px"
        ></iframe>
      </ng-container>

      <!-- Docx Download Button -->
      <ng-container *ngIf="isDocx">
        <div class="alert alert-info d-flex align-items-center mb-4" style="font-size: 14px">
          <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
          <div>
            <strong>Instructions:</strong> The attached document is a Word file. Please download to
            view it.
          </div>
        </div>
        <div class="d-flex justify-content-center mt-4 mb-4">
          <button nz-button nzType="primary" (click)="downloadDraft()">
            <span nz-icon nzType="download"></span> Download Word Document
          </button>
        </div>
      </ng-container>

      <!-- Rich Text Box (If neither PDF nor DOCX exists) -->
      <ng-container *ngIf="!isPdf && !isDocx">
        <app-dmsrich-text-edit
          [editorStyle]="{ width: '100%', height: '500px' }"
          [contentHtml]="templateHtml"
          (contentHtmlChange)="templateHtml = $event"
        ></app-dmsrich-text-edit>
      </ng-container>
    </div>
  </div>
</ng-template>
