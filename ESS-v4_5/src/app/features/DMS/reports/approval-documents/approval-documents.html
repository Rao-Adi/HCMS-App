<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">View Document (Approved)</h3>
            <small class="text-muted">View Document (Approved)</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="row row-space">
              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <h3 class="PnlHeader">
                    {{ 'labels.Cabinet' | safeTranslate }}
                  </h3>
                  <br />
                  <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                      <div class="PnlHeading">
                        <label>{{ 'labels.Document Type' | safeTranslate }} </label>
                      </div>
                      <div>
                        <app-document-type-list
                          valueKey="CODE"
                          labelKey="NAME"
                          placeholder="Select Document Type"
                          [(ngModel)]="selectedDocumentType"
                          (valueChange)="onDocumentTypeChange($event)"
                          width="250px"
                        >
                        </app-document-type-list>
                      </div>
                    </div>
                    <div class="col-lg-9 col-md-9 col-sm-9 mb-10">
                      <app-cabinet-structure-list (hierarchyChange)="onHierarchyChange($event)">
                      </app-cabinet-structure-list>
                    </div>
                  </div>
                  <br />
                  <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                      <div class="PnlHeading">
                        <label>{{ 'labels.Request Created by' | safeTranslate }}</label>
                      </div>
                      <div>
                        <nz-select
                          style="width: 250px"
                          [(ngModel)]="selectedAuthorityType"
                          nzPlaceHolder="Select"
                          (ngModelChange)="onAuthorityTypeChange($event)"
                          nzAllowClear
                          nzShowSearch
                        >
                          <nz-option
                            *ngFor="let dep of requestCreators"
                            [nzValue]="dep.CODE"
                            [nzLabel]="dep.NAME"
                          >
                          </nz-option>
                        </nz-select>
                      </div>
                    </div>
                  </div>
                  <br />
                  <div class="row">
                    <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                      <h3 class="PnlHeader">Document Approved Between</h3>
                      <br />
                      <!-- Authority Type -->
                      <div class="row">
                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                          <div class="d-flex flex-column">
                            <span>From Date</span>
                            <br />
                            <nz-date-picker
                              [nzRenderExtraFooter]="footerRender"
                              [nzFormat]="dateFormat"
                            ></nz-date-picker>
                          </div>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                          <div class="d-flex flex-column">
                            <span>To Date</span>
                            <br />
                            <nz-date-picker
                              [nzRenderExtraFooter]="footerRender"
                              [nzFormat]="dateFormat"
                            ></nz-date-picker>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                      <h3 class="PnlHeader">Request Created Between</h3>
                      <br />
                      <div class="row">
                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                          <div class="d-flex flex-column">
                            <span>From Date</span>
                            <br />
                            <nz-date-picker
                              [nzRenderExtraFooter]="footerRender"
                              [nzFormat]="dateFormat"
                            ></nz-date-picker>
                          </div>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
                          <div class="d-flex flex-column">
                            <span>To Date</span>
                            <br />
                            <nz-date-picker
                              [nzRenderExtraFooter]="footerRender"
                              [nzFormat]="dateFormat"
                            ></nz-date-picker>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <div class="row">
                    <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <div class="PnlHeading">
                        <h3 class="PnlHeader">Documents</h3>
                      </div>
                      <br />
                      <div class="col-lg-12 col-md-12 col-sm-12">
                        <app-my-pending-request-for-approval> </app-my-pending-request-for-approval>
                        <!-- <app-ag-grid-wrapper
                          [gridStyle]="{ width: '100%', height: '250px' }"
                          [columnDefs]="documentsColumnDefs"
                          [defaultColDef]="defaultColDef"
                          [rowData]="documentTypeData"
                          [pageSize]="selectedPageSize"
                          [isSelectionRequired]="false"
                          [showDisplayOption]="false"
                          gridId="documentGrid"
                          (pageSizeChange)="onPageSizeChanged($event)"
                          [totalRows]="totalDocuments"
                          (serverQuery)="GetAllDocuments($event)"
                        >
                        </app-ag-grid-wrapper> -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
