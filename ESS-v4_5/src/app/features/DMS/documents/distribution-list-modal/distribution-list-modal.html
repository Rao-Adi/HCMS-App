<div class="table-responsive">
  <table class="table table-bordered table-hover mb-0">
    <thead class="table-light">
      <tr>
        <th>Role</th>
        <th>Distribution Type</th>
        <ng-container *ngIf="isObsoletion">
          <th>Status</th>
          <th>Retrieved By</th>
        </ng-container>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="pagedItems.length === 0">
        <td [attr.colspan]="isObsoletion ? 4 : 2" class="text-center text-muted py-4">
          No distribution entries.
        </td>
      </tr>
      <tr *ngFor="let item of pagedItems">
        <td>{{ item.Role || item.role || 'Any' }}</td>
        <td>
          <i class="bi me-1 text-muted" [ngClass]="typeIcon(item)"></i>{{ distributionType(item) }}
        </td>
        <ng-container *ngIf="isObsoletion">
          <td>
            <span
              class="badge rounded-pill"
              [ngClass]="isRetrieved(item) ? 'text-bg-success' : 'text-bg-danger'"
            >
              <i class="bi" [ngClass]="isRetrieved(item) ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
              {{ isRetrieved(item) ? 'Retrieved' : 'Not Retrieved' }}
            </span>
          </td>
          <td>{{ retrievedByName(item) || '-' }}</td>
        </ng-container>
      </tr>
    </tbody>
  </table>
</div>

<div class="d-flex align-items-center justify-content-between mt-3" *ngIf="distributionList.length > pageSize">
  <span class="text-muted" style="font-size: 13px">Page {{ page }} of {{ totalPages }}</span>
  <div class="d-flex gap-2">
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary retrieval-status-btn"
      [disabled]="page <= 1"
      (click)="previousPage()"
    >
      &lsaquo; Previous
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary retrieval-status-btn"
      [disabled]="page >= totalPages"
      (click)="nextPage()"
    >
      Next &rsaquo;
    </button>
  </div>
</div>

<div class="d-flex justify-content-end mt-3">
  <button type="button" class="btn btn-primary btn-auto-width" (click)="close()">Close</button>
</div>
