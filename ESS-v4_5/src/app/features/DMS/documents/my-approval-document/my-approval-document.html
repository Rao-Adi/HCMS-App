<div class="container-fluid">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="card-custom">
          <div class="clearfix">
            <div class="pull-left">
              <h3 class="mt-0">My Approvals – Request for Document Creation/Update</h3>
              <small class="text-muted">My Approvals – Request for Document Creation/Update</small>
            </div>
          </div>
          <br />
          <hr />

          <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <h3 class="PnlHeader">
              {{ 'labels.Filters' | safeTranslate }}
            </h3>
            <br />
            <div class="row">
              <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.Division' | safeTranslate }} </label>
                </div>
                <div class="Divtxtemployeeschright" style="width: 250px">
                  <div>
                    <app-division-list
                      valueKey="CODE"
                      labelKey="NAME"
                      placeholder="Select Division"
                      [(ngModel)]="selectedDivisions"
                      (valueChange)="onDepartmentsChange($event)"
                      width="250px"
                    >
                    </app-division-list>
                  </div>
                </div>
              </div>

              <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.Department' | safeTranslate }}</label>
                </div>
                <div>
                  <app-department-list
                    valueKey="CODE"
                    labelKey="NAME"
                    placeholder="Select Department"
                    [(ngModel)]="selectedDepartment"
                    (valueChange)="onDepartmentsChange($event)"
                    width="250px"
                  >
                  </app-department-list>
                </div>
              </div>

              <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.SubDepartment' | safeTranslate }}</label>
                </div>
                <div>
                  <app-sub-department-list
                    valueKey="CODE"
                    labelKey="NAME"
                    placeholder="Select Department"
                    [(ngModel)]="selectedDepartment"
                    (valueChange)="onDepartmentsChange($event)"
                    width="250px"
                  >
                  </app-sub-department-list>
                </div>
              </div>

              <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.DocumentType' | safeTranslate }} </label>
                </div>
                <div>
                  <nz-select
                    style="width: 250px"
                    [nzPlaceHolder]="'Select DocumentType'"
                    nzAllowClear
                    nzShowSearch
                  >
                    <nz-option
                      *ngFor="let dep of documentTypes"
                      [nzValue]="dep.CODE"
                      [nzLabel]="dep.NAME"
                    >
                    </nz-option>
                  </nz-select>
                </div>
              </div>
            </div>
          </div>
          <br />
          <hr />
          <div class="col-lg-12 col-md-12 col-sm-12">
            <div class="main-content d-flex flex-column min-vw-0">
              <div class="custom-tab-container">
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'Pending' }"
                  (click)="selectedTab = 'Pending'"
                >
                  Pending
                </button>
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'Approved' }"
                  (click)="selectedTab = 'Approved'"
                >
                  Approved
                </button>

                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'Disapproved' }"
                  (click)="selectedTab = 'Disapproved'"
                >
                  Disapproved
                </button>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'Pending'">
                <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="status-box-leftColmd6-standard">
                    <h3 class="PnlHeader">Documents</h3>
                    <br />
                    <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <app-ag-grid-wrapper
                          [gridStyle]="{ width: '100%', height: '550px' }"
                          class="ag-theme-alpine"
                          [rowData]="pendingDocumentData"
                          [columnDefs]="pendingDocumentsGridColumnDefs"
                          [defaultColDef]="defaultColDef"
                          [overlayNoRowsTemplate]="noRowsOverlay"
                          [pagination]="true"
                          [pageSize]="10"
                        >
                        </app-ag-grid-wrapper>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'Approved'">
                <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="status-box-leftColmd6-standard">
                    <h3 class="PnlHeader">Documents</h3>
                    <br />
                    <app-ag-grid-wrapper
                      [gridStyle]="{ width: '100%', height: '550px' }"
                      class="ag-theme-alpine"
                      [rowData]="pendingDocumentData"
                      [columnDefs]="pendingDocumentsGridColumnDefs"
                      [defaultColDef]="defaultColDef"
                      [overlayNoRowsTemplate]="noRowsOverlay"
                      [pagination]="true"
                      [pageSize]="10"
                    >
                    </app-ag-grid-wrapper>
                  </div>
                </div>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'Disapproved'">
                <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="status-box-leftColmd6-standard">
                    <h3 class="PnlHeader">Documents</h3>
                    <br />
                    <app-ag-grid-wrapper
                      [gridStyle]="{ width: '100%', height: '550px' }"
                      class="ag-theme-alpine"
                      [rowData]="pendingDocumentData"
                      [columnDefs]="pendingDocumentsGridColumnDefs"
                      [defaultColDef]="defaultColDef"
                      [overlayNoRowsTemplate]="noRowsOverlay"
                      [pagination]="true"
                      [pageSize]="10"
                    >
                    </app-ag-grid-wrapper>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
