<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="main-content d-flex flex-column min-vw-0">
          <div class="custom-tab-container">
            <button
              class="tab-button"
              tabindex="0"
              [ngClass]="{ 'active-tab': selectedTab === 'Classroom' }"
              (click)="selectedTab = 'Classroom'"
            >
              Class Room
              <span
                class="badge rounded-pill bg-warning text-dark border shadow-sm font-monospace px-2 py-1"
                style="font-size: 11px"
                *ngIf="classRoomPendingCount > 0"
                >{{ classRoomPendingCount }}</span
              >
            </button>
            <button
              class="tab-button"
              tabindex="0"
              [ngClass]="{ 'active-tab': selectedTab === 'Online' }"
              (click)="selectedTab = 'Online'"
            >
              Online
              <span
                class="badge rounded-pill bg-warning text-dark border shadow-sm font-monospace px-2 py-1"
                style="font-size: 11px"
                *ngIf="onlinePendingCount > 0"
                >{{ onlinePendingCount }}</span
              >
            </button>
          </div>

          <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="Master-box mb-4">
              <h3 class="PnlHeader">
                {{ 'labels.Filter' | safeTranslate }}
              </h3>
              <div class="row">
                <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                  <div class="PnlHeading">
                    <label>{{ 'labels.Document ype' | safeTranslate }} </label>
                  </div>
                  <div>
                    <!-- <nz-select
                      style="width: 200px"
                      [nzPlaceHolder]="'Select Filter'"
                      [(ngModel)]="selectedDocumentType"
                      (valueChange)="onDocumentTypeChange($event)"
                      nzAllowClear
                      nzShowSearch
                    >
                      <nz-option
                        *ngFor="let dep of documentTypes"
                        [nzValue]="dep.CODE"
                        [nzLabel]="dep.NAME"
                      >
                      </nz-option>
                    </nz-select> -->
                    <app-document-type-list
                      valueKey="CODE"
                      labelKey="NAME"
                      placeholder="Select Document Type"
                      [(ngModel)]="selectedDocumentType"
                      (valueChange)="onDocumentTypeChange($event)"
                      width="250px"
                      [allowClear]="false"
                    >
                    </app-document-type-list>
                  </div>
                </div>
                <div class="col-lg-9 col-md-9 col-sm-9 mb-10">
                  <app-cabinet-structure-list (hierarchyChange)="onHierarchyChange($event)">
                  </app-cabinet-structure-list>
                </div>
              </div>
            </div>
          </div>
          <div class="row row-space" *ngIf="selectedTab === 'Classroom' && isGridVisible">
            <div class="col-lg-12 col-md-12 col-sm-12">
              <app-ag-grid-wrapper
                [gridStyle]="{ width: '100%', height: '450px' }"
                [columnToggles]="columnToggles"
                [columnDefs]="classRoomColumnDefs"
                [defaultColDef]="defaultColDef"
                [isSelectionRequired]="true"
                [showDisplayOption]="true"
                [autoSizeColumns]="true"
                [rowData]="classRoomData"
                [pageSize]="pageSize"
                [totalRows]="totalClassRoom"
                [pageSize]="selectedPageSize"
                gridId="documentGrid"
                (pageSizeChange)="onPageSizeChanged($event)"
                (serverQuery)="GetAllClassRooms($event)"
                (selectionChange)="onSelectionChange($event)"
              >
                <div grid-actions class="grid-action-icons">
                  <button
                    class="btn btn-success btn-sm btn-action"
                    [class.disabled]="!hasSelectedRows"
                    title="Approve"
                    (click)="approve()"
                    [disabled]="hasSelectedRows === false"
                  >
                    <i class="bi bi-check-circle"></i> Approve
                  </button>
                </div>
              </app-ag-grid-wrapper>
            </div>
          </div>

          <div class="row row-space" *ngIf="selectedTab === 'Online' && isGridVisible">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <app-ag-grid-wrapper
                [gridStyle]="{ width: '100%', height: '450px' }"
                [columnDefs]="classRoomColumnDefs"
                [columnToggles]="columnToggles"
                [defaultColDef]="defaultColDef"
                [rowData]="onlineData"
                [pageSize]="selectedPageSize"
                [isSelectionRequired]="true"
                [showDisplayOption]="true"
                [autoSizeColumns]="true"
                gridId="onlineGrid"
                [totalRows]="totalOnline"
                (pageSizeChange)="onPageSizeChanged($event)"
                (serverQuery)="GetAllOnline($event)"
                (selectionChange)="onSelectionChange($event)"
              >
                <div grid-actions class="grid-action-icons">
                  <button
                    class="btn btn-success btn-sm btn-action"
                    [class.disabled]="!hasSelectedRows"
                    title="Approve"
                    (click)="approve()"
                    [disabled]="hasSelectedRows === false"
                  >
                    <i class="bi bi-check-circle"></i> Approve
                  </button>
                </div>
              </app-ag-grid-wrapper>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Document Content Modal Template -->
<ng-template #documentModalTpl>
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <!-- Download Button (If URL exists) -->
      <ng-container *ngIf="draftFileUrl">
        <div class="alert alert-info d-flex align-items-center mb-4" style="font-size: 14px">
          <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
          <div>
            <strong>Instructions:</strong> Please download the attached document to view it.
          </div>
        </div>
        <div class="d-flex justify-content-center mt-4 mb-4">
          <button nz-button nzType="primary" (click)="downloadDraft()">
            <span nz-icon nzType="download"></span> Download Document
          </button>
        </div>
      </ng-container>

      <!-- Rich Text Box (If no URL but content exists) -->
      <ng-container *ngIf="!draftFileUrl && templateHtml">
        <app-dmsrich-text-edit
          [editorStyle]="{ width: '100%', height: '500px' }"
          [contentHtml]="templateHtml"
          (contentHtmlChange)="templateHtml = $event"
        ></app-dmsrich-text-edit>
      </ng-container>

      <!-- Neither a file nor HTML content is available -->
      <ng-container *ngIf="!draftFileUrl && !templateHtml">
        <div class="alert alert-warning text-center mb-0" style="font-size: 14px">
          No template found.
        </div>
      </ng-container>
    </div>
  </div>
</ng-template>
