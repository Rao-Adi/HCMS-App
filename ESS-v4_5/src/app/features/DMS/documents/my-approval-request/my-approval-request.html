<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">My Approvals – Request for Document Creation/Update</h3>
            <small class="text-muted">My Approvals – Request for Document Creation/Update</small>
          </div>
        </div>
        <br />
        <hr />
        <!-- <div class="col-lg-4 col-md-4 col-sm-6 mb-10">
          <span class="d-flex">Employee</span>
          <nz-select
            style="width: 250px"
            [(ngModel)]="selectedEmployee"
            nzPlaceHolder="Select Employee"
            (ngModelChange)="onEmployeeChange($event)"
            nzAllowClear
            nzShowSearch
          >
            <nz-option *ngFor="let dep of employees" [nzValue]="dep.CODE" [nzLabel]="dep.NAME">
            </nz-option>
          </nz-select>
        </div> -->
        <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <h3 class="PnlHeader">
            {{ 'labels.Filters' | safeTranslate }}
          </h3>
          <br />
          <div class="row">
            <div class="col-lg-9 col-md-9 col-sm-9 mb-10">
              <app-cabinet-structure-list (hierarchyChange)="onHierarchyChange($event)">
              </app-cabinet-structure-list>
            </div>

            <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
              <div class="PnlHeading">
                <label>{{ 'labels.Document Type' | safeTranslate }} </label>
              </div>
              <div>
                <app-document-type-list
                  valueKey="CODE"
                  labelKey="NAME"
                  placeholder="Select Document Type"
                  [(ngModel)]="selectedDocumentType"
                  (valueChange)="onDocumentTypeChange($event)"
                  width="250px"
                >
                </app-document-type-list>
              </div>
            </div>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Pending' }"
                (click)="onTabChange('Pending')"
              >
                Pending
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Approved' }"
                (click)="onTabChange('Approved')"
              >
                Approved
              </button>

              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Rejected' }"
                (click)="onTabChange('Rejected')"
              >
                Rejected
              </button>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Pending'">
              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <h3 class="PnlHeader">Documents</h3>
                  <br />
                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <app-ag-grid-wrapper
                          [gridStyle]="{ width: '100%', height: '450px' }"
                          [columnToggles]="columnToggles"
                          [columnDefs]="documentColumnDefs"
                          [defaultColDef]="defaultColDef"
                          [isSelectionRequired]="true"
                          [showDisplayOption]="true"
                          [rowData]="documentRequestsData"
                          [pageSize]="selectedPageSize"
                          [pageSizeOptions]="[10, 20, 50, 100]"
                          [totalRows]="totalRows"
                          gridId="documentGridPending"
                          (pageSizeChange)="onPageSizeChanged($event)"
                          (selectionChange)="onSelectionChange($event)"
                          (serverQuery)="GetAllPendingDocuments($event)"
                          (cellClicked)="onCellClicked($event)"
                        >
                          <div grid-actions class="grid-action-icons">
                            <button
                              class="grid-icon-btn"
                              [class.disabled]="!hasSelectedRows"
                              title="Approve"
                              (click)="promptAction('APPROVED')"
                              [disabled]="hasSelectedRows === false"
                            >
                              <i class="bi bi-check2-square"></i>
                            </button>

                            <button
                              class="grid-icon-btn"
                              [class.disabled]="!hasSelectedRows"
                              title="Disapprove"
                              (click)="promptAction('REJECTED')"
                              [disabled]="hasSelectedRows === false"
                            >
                              <i class="bi bi-x-square"></i>
                            </button>

                            <button
                              class="grid-icon-btn"
                              [class.disabled]="!hasSelectedRows"
                              title="REWORK"
                              (click)="promptAction('REWORKED')"
                              [disabled]="hasSelectedRows === false"
                            >
                              <i class="bi bi-reply"></i>
                            </button>

                            <button
                              class="grid-icon-btn"
                              [class.disabled]="!hasSelectedRows"
                              title="Export"
                              (click)="export()"
                              [disabled]="hasSelectedRows === false"
                            >
                              <i class="bi bi-filetype-xls"></i>
                            </button>
                          </div>
                        </app-ag-grid-wrapper>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Approved'">
              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <h3 class="PnlHeader">Documents</h3>
                  <br />
                  <app-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '450px' }"
                    [columnToggles]="columnToggles"
                    [columnDefs]="documentColumnDefs"
                    [defaultColDef]="defaultColDef"
                    [isSelectionRequired]="false"
                    [showDisplayOption]="true"
                    [rowData]="documentRequestsData"
                    [totalRows]="totalRows"
                    [pageSize]="selectedPageSize"
                    gridId="documentGridApproved"                    
                    (pageSizeChange)="onPageSizeChanged($event)"
                    (selectionChange)="onSelectionChange($event)"
                    (serverQuery)="GetAllPendingDocuments($event)"
                    (cellClicked)="onCellClicked($event)"
                  >
                  </app-ag-grid-wrapper>
                </div>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Rejected'">
              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <h3 class="PnlHeader">Documents</h3>
                  <br />
                  <app-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '450px' }"
                    [columnToggles]="columnToggles"
                    [columnDefs]="documentColumnDefs"
                    [defaultColDef]="defaultColDef"
                    [isSelectionRequired]="false"
                    [showDisplayOption]="true"
                    [rowData]="documentRequestsData"
                    [totalRows]="totalRows"
                    [pageSize]="selectedPageSize"
                    gridId="documentGridDisapproved"
                    (pageSizeChange)="onPageSizeChanged($event)"
                    (selectionChange)="onSelectionChange($event)"
                    (serverQuery)="GetAllPendingDocuments($event)"
                    (cellClicked)="onCellClicked($event)"
                  >
                  </app-ag-grid-wrapper>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row mt-10" *ngIf="requestId">
          <div class="col-lg-12 col-md-12 col-sm-12">
            <h3 class="PnlHeader">Document Content</h3>
            <br />
            
            <!-- HTML Template Editor -->
            <ng-container *ngIf="!draftFileUrl">
              <app-dmsrich-text-edit
                [editorStyle]="{ width: '100%', height: '350px' }"
                [contentHtml]="templateHtml"
                (contentHtmlChange)="templateHtml = $event"
              ></app-dmsrich-text-edit>
            </ng-container>

            <!-- Word/PDF File Download -->
            <ng-container *ngIf="draftFileUrl">
              <div class="alert alert-info d-flex align-items-center mb-4" style="font-size: 14px;">
                <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
                <div>
                  <strong>Instructions:</strong> Please download and review the drafted document attached to this request.
                </div>
              </div>
              
              <div class="d-flex align-items-center gap-3 mb-4"> 
                <button type="button" class="btn btn-outline-success" (click)="downloadDraft()">
                  <i class="bi bi-file-earmark-arrow-down me-1"></i> Download Drafted Document
                </button>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
