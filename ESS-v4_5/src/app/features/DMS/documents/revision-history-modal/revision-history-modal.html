<app-ag-grid-wrapper
  [gridStyle]="{ width: '100%', height: '450px' }"
  [columnDefs]="revisionHistoryColumnDefs"
  [defaultColDef]="defaultColDef"
  [isSelectionRequired]="false"
  [showDisplayOption]="false"
  [autoSizeColumns]="true"
  [rowData]="revisionHistoryData"
  [pageSize]="selectedPageSize"
  [totalRows]="totalRows"
  [loading]="loading"
  gridId="documentGrid"
></app-ag-grid-wrapper>
