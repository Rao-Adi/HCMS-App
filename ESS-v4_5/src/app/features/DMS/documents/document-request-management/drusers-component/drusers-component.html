<div class="row mb-10">
  <div class="col-12">
    <div class="alert alert-info d-flex align-items-center mb-0 shadow-sm" style="font-size: 14px; border-left: 4px solid #0dcaf0;">
      <i class="bi bi-info-circle-fill me-3 fs-5 text-info"></i>
      <div>
        <strong>Instructions:</strong> Tag specific individuals to the Document, assigned for mandatory training or access.
      </div>
    </div>
  </div>
</div>

<app-editable-ag-grid-wrapper
  [showSearchBar]="false"
  [gridStyle]="{ width: '100%', height: '250px' }"
  class="ag-theme-alpine"
  [gridId]="'employee-planning-grid'"
  [autoSizeColumns]="true"
  [config]="gridConfig"
  [rowData]="manualUserData"
  [divisionList]="divisions"
  [departmentList]="departments"
  [subDepartmentList]="subDepartments"
  [pinnedTopRowData]="pinnedTopRowDataPlanning"
  [isSelectionRequired]="true"
  (rowAdded)="onRowAdded($event)"
  (rowUpdated)="onRowUpdated($event)"
  (rowDeleted)="onRowDeleted($event)"
  (cellValueChanged)="onCellValueChanged($event)"
  (selectionChanged)="onSelectionChanged($event)"
  (actionClicked)="handleGridAction($event)"
  (gridReady)="onGridReady($event)"
>
</app-editable-ag-grid-wrapper>
