<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Request for Document Creation/Update</h3>
            <small class="text-muted">Request for Document Creation/Update</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'NewRequest' }"
                (click)="selectedTab = 'NewRequest'"
              >
                New Request
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'MyRequestPendingApproval' }"
                (click)="selectedTab = 'MyRequestPendingApproval'"
              >
                My Request For Pending Approval
              </button>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'NewRequest'">
              <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="status-box-leftColmd6-standard">
                  <h3 class="PnlHeader">Document Justification</h3>
                  <br />
                  <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                      <div class="PnlHeading">
                        <label>{{ 'labels.RequestType' | safeTranslate }} </label>
                      </div>
                      <div>
                        <nz-select
                          style="width: 250px"
                          [(ngModel)]="selectedDocumentRequestType"
                          nzPlaceHolder="Select RequestType"
                          (ngModelChange)="onAuthorityTypeChange($event)"
                          nzAllowClear
                          nzShowSearch
                        >
                          <nz-option
                            *ngFor="let dep of requestTypes"
                            [nzValue]="dep.id"
                            [nzLabel]="dep.text"
                          >
                          </nz-option>
                        </nz-select>
                      </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                      <div class="PnlHeading">
                        <label>{{ 'labels.Company' | safeTranslate }} </label>
                      </div>
                      <div class="Divtxtemployeeschright">
                        <div>
                          <nz-select
                            style="width: 250px"
                            [nzPlaceHolder]="'Select Company'"
                            [(ngModel)]="selectedCompany"
                            (ngModelChange)="onCompanyChange($event)"
                            nzAllowClear
                            nzShowSearch
                          >
                            <nz-option
                              *ngFor="let dep of companies"
                              [nzValue]="dep.id"
                              [nzLabel]="dep.text"
                            >
                            </nz-option>
                          </nz-select>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="mt-4">
                    <!-- Dynamic Columns -->
                    <ng-container [ngSwitch]="selectedDocumentRequestType">
                      <div *ngIf="showDocumentDiv">
                        <div class="row">
                          <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                            <span class="d-flex">Filter</span>
                            <nz-select
                              style="width: 200px"
                              [nzPlaceHolder]="'Select Filter'"
                              nzAllowClear
                              nzShowSearch
                            >
                              <nz-option
                                *ngFor="let dep of filters"
                                [nzValue]="dep.CODE"
                                [nzLabel]="dep.NAME"
                              >
                              </nz-option>
                            </nz-select>
                          </div>
                        </div>
                        <br />
                        <br />
                        <div class="row">
                          <div class="col-lg-12 col-md-12 col-sm-6 mb-10">
                            <div class="PnlHeading">
                              <h3 class="PnlHeader">Documents</h3>
                            </div>
                            <div class="mt-4">
                              <app-documents-component></app-documents-component>
                            </div>
                            <br />
                            <br />
                            <span class="d-flex">Justification</span>
                            <textarea
                              rows="4"
                              nz-input
                              [(ngModel)]="inputJustificationValue"
                            ></textarea>
                          </div>
                        </div>
                      </div>
                      <!-- CASE 1: 3 Columns -->
                      <div *ngIf="showOtherDiv">
                        <div class="row-space">
                          <div class="col-lg-3 col-md-3 col-sm-6 mb-10 mt-4">
                            <span class="d-flex">Document Name</span>
                            <input
                              maxlength="10"
                              appDecimalInput
                              name="DocumentName"
                              type="text"
                              style="width: 250px !important"
                              [ngClass]="{
                                'form-control': true,
                                'input-sm': true,
                              }"
                            />
                          </div>
                          <div class="col-lg-9 col-md-9 col-sm-6 mb-10 mt-4">
                            <span class="d-flex">Justification</span>
                            <textarea
                              rows="4"
                              nz-input
                              [(ngModel)]="inputJustificationValue"
                            ></textarea>
                          </div>
                        </div>
                        <br />
                        <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                          <h3 class="PnlHeader">Cabinet</h3>
                          <br />
                          <div class="row">
                            <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                              <div class="PnlHeading">
                                <label>{{ 'labels.DocumentType' | safeTranslate }} </label>
                              </div>
                              <div>
                                <app-document-type-list
                                  valueKey="CODE"
                                  labelKey="NAME"
                                  placeholder="Select DocumentType"
                                  [(ngModel)]="selectedDocumentType"
                                  (valueChange)="onDocumentTypeChange($event)"
                                  width="250px"
                                >
                                </app-document-type-list>
                              </div>
                            </div>

                            <div class="col-lg-9 col-md-9 col-sm-9 mb-10">
                              <app-cabinet-structure-list></app-cabinet-structure-list>
                            </div>

                            <!-- <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                              <div class="PnlHeading">
                                <label>{{ 'labels.Division' | safeTranslate }} </label>
                              </div>
                              <div class="Divtxtemployeeschright" style="width: 250px">
                                <div>
                                  <app-division-list
                                    valueKey="CODE"
                                    labelKey="NAME"
                                    placeholder="Select Division"
                                    [(ngModel)]="selectedDivisions"
                                    (valueChange)="onDivisionChange($event)"
                                    width="250px"
                                  >
                                  </app-division-list>
                                </div>
                              </div>
                            </div>

                            <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                              <div class="PnlHeading">
                                <label>{{ 'labels.Department' | safeTranslate }}</label>
                              </div>
                              <div>
                                <app-department-list
                                  valueKey="CODE"
                                  labelKey="NAME"
                                  placeholder="Select Department"
                                  [division]="selectedDivisions"
                                  [(ngModel)]="selectedDepartment"
                                  (valueChange)="onDepartmentsChange($event)"
                                  width="250px"
                                >
                                </app-department-list>
                              </div>
                            </div>

                            <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                              <div class="PnlHeading">
                                <label>{{ 'labels.SubDepartment' | safeTranslate }}</label>
                              </div>
                              <div>
                                <app-sub-department-list
                                  valueKey="CODE"
                                  labelKey="NAME"
                                  placeholder="Select SubDepartment"
                                  [department]="selectedDepartment"
                                  [(ngModel)]="selectedSubDepartment"
                                  width="250px"
                                >
                                </app-sub-department-list>
                              </div>
                            </div> -->
                          </div>
                        </div>

                        <br />
                        <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                          <h3 class="PnlHeader">Users</h3>
                          <br />
                          <div class="col-lg-12 col-md-12 col-sm-12">
                            <app-drusers-component></app-drusers-component>
                          </div>
                        </div>
                        <br />
                        <br />
                        <hr />

                        <div class="row-space">
                          <h3 class="PnlHeader">Distribution List</h3>
                          <br />
                          <div class="col-lg-12 col-md-12 col-sm-12">
                            <app-drdistribution-list
                             [DocumentRequestType]="selectedDocumentRequestType"></app-drdistribution-list>
                          </div>
                        </div>
                        <br />
                        <br />
                        <hr />
                        <div class="row mb-4">
                          <div class="col-lg-12 col-md-12 col-sm-12">
                            <h3 class="PnlHeader">Document Content</h3>
                            <br />
                            <app-dmsrich-text-edit
                              [editorStyle]="{ width: '100%', height: '250px' }"
                            ></app-dmsrich-text-edit>
                          </div>
                        </div>
                        <br />
                        <br />
                        <hr />
                        <div class="row mt-4">
                          <div class="col-lg-12 col-md-12 col-sm-12">
                            <h3 class="PnlHeader">Workflow Authorities</h3>
                            <br />
                            <app-ag-grid-wrapper
                              [gridStyle]="{ width: '100%', height: '250px' }"
                              [columnDefs]="workflowAuthoritiesColumnDefs"
                              [defaultColDef]="defaultColDef"
                              [rowData]="workflowAuthoritiesData"
                              [isSelectionRequired]="false"
                              [showDisplayOption]="false"
                              [pageSize]="pageSize"
                              [totalRows]="totalWorkflowAuthorities"
                              [pageSize]="selectedPageSize"
                              gridId="workflowAuthorities1Grid1Grid"
                              (pageSizeChange)="onPageSizeChanged($event)"
                              (serverQuery)="GetAllWorkflowAuthorities($event)"
                            >
                            </app-ag-grid-wrapper>
                          </div>
                        </div>
                      </div>

                      <!-- DEFAULT CASE: No Columns -->
                    </ng-container>
                  </div>
                </div>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'MyRequestPendingApproval'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <!-- <app-my-pending-request-for-approval> </app-my-pending-request-for-approval> -->
              </div>
            </div>
          </div>
        </div>

        <div class="row mt-4 btn-stick">
          <div class="col-lg-12 col-md-12 col-sm-12">
            <button class="tab-button" tabindex="0" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
