<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12 mb-4">
    <app-ag-grid-wrapper
      [gridStyle]="{ width: '100%', height: '450px' }"
      [columnToggles]="columnToggles"
      [columnDefs]="documentColumnDefs"
      [defaultColDef]="defaultColDef"
      [isSelectionRequired]="false"
      [showDisplayOption]="true"
      [rowData]="documentRequestsData"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50, 100]"
      [totalRows]="totalRows"
      gridId="documentGrid"
      (serverQuery)="GetAllPendingRequests($event)"
      (pageSizeChange)="onPageSizeChanged($event)"
      (selectionChange)="onSelectionChange($event)"
    >
    </app-ag-grid-wrapper>
  </div>
</div>
