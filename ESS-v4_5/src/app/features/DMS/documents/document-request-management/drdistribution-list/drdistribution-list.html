<div class="row mb-10">
  <div class="col-12">
    <div class="alert alert-info d-flex align-items-center mb-0 shadow-sm" style="font-size: 14px; border-left: 4px solid #0dcaf0;">
      <i class="bi bi-info-circle-fill me-3 fs-5 text-info"></i>
      <div>
        <strong>Instructions:</strong> Define role-based access: select Digital for viewing document on the system or Physical for authorized controlled prints.
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-end mb-2" *ngIf="distributionListData.length > 0">
  <button style="min-width:150px"
    type="button"
    class="btn btn-sm btn-outline-danger mt-2"
    (click)="clearAllDistribution()"
  >
    <i class="bi bi-trash me-1"></i> Clear All
  </button>
</div>

<div style="position: relative;">
  <app-spinner *ngIf="loading"></app-spinner>
  <app-editable-ag-grid-wrapper
    [showSearchBar]="false"
    [gridStyle]="{ width: '100%', height: '300px' }"
    class="ag-theme-alpine"
    [autoSizeColumns]="true"
    [gridId]="'employee-planning-grid'"
    [config]="gridConfig"
    [rowData]="distributionListData"
    [divisionList]="divisions"
    [departmentList]="departments"
    [subDepartmentList]="subDepartments"
    [businessDomainList]="businessDomains"
    [roleList]="userRoles"
    [isSelectionRequired]="true"
    [pinnedTopRowData]="pinnedTopRowDataPlanning"
    (rowAdded)="onRowAdded($event)"
    (rowUpdated)="onRowUpdated($event)"
    (rowDeleted)="onRowDeleted($event)"
    (cellValueChanged)="onCellValueChanged($event)"
    (selectionChanged)="onSelectionChanged($event)"
    (gridReady)="onGridReady($event)"
  >
  </app-editable-ag-grid-wrapper>
</div>
