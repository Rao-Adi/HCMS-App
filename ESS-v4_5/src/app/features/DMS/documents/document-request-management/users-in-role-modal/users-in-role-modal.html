<app-ag-grid-wrapper
  [gridStyle]="{ width: '100%', height: '450px' }"
  [columnDefs]="documentColumnDefs"
  [defaultColDef]="defaultColDef"
  [isSelectionRequired]="true"
  [showDisplayOption]="false"
  [autoSizeColumns]="true"
  [rowData]="workflowAuthoritiesData"
  [pageSize]="pageSize"
  [totalRows]="totalRows"
  [pageSize]="selectedPageSize"
  gridId="documentGrid"
  (pageSizeChange)="onPageSizeChanged($event)"
  (serverQuery)="GetAllDocuments($event)"
  (selectionChange)="onSelectionChange($event)"
>

<div class="row mt-4 btn-stick">
  <div class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-center gap-3 px-4 pb-3">
    <div class="col-sm-1">
      <button
        type="button"
        tabindex="0"
        class="btn btn-sm btn-outline-secondary shadow-sm"
        (click)="save()"
      >
        <i class="bi bi-file-earmark-text me-2"></i>
        Save
      </button>
    </div>
  </div>
</div>
