<div class="uncontrolled-doc-form">
  <div class="mb-3" *ngIf="isCreateMode">
    <label class="form-label">Document Name <span class="text-danger">*</span></label>
    <input type="text" class="form-control" [(ngModel)]="documentName" placeholder="Enter document name" />
  </div>

  <div class="mb-3" *ngIf="!isCreateMode">
    <label class="form-label">Document Name</label>
    <input type="text" class="form-control" [value]="documentName" disabled />
  </div>

  <div class="mb-3">
    <label class="form-label">Review Date <span class="text-danger">*</span></label>
    <input type="date" class="form-control" [(ngModel)]="reviewDate" />
  </div>

  <div class="mb-3" *ngIf="isCreateMode">
    <label class="form-label">Review Authority <span class="text-danger">*</span></label>
    <app-employee-list
      [(ngModel)]="reviewAuthorityEmpCode"
      [isMultiSelect]="false"
      placeholder="Select Review Authority"
      width="100%"
    ></app-employee-list>
  </div>

  <div class="mb-3">
    <label class="form-label">
      {{ isCreateMode ? 'Document File' : 'Updated Document File' }} <span class="text-danger">*</span>
    </label>
    <input type="file" class="form-control" (change)="onFileSelected($event)" />
    <div class="form-text" *ngIf="!isCreateMode">
      Uploading a new file will replace the current document. The previous file remains available in
      History.
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <button class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    <button class="btn btn-primary" [disabled]="!canSubmit || submitting" (click)="submit()">
      {{ submitting ? 'Saving...' : isCreateMode ? 'Upload' : 'Submit Review' }}
    </button>
  </div>
</div>
