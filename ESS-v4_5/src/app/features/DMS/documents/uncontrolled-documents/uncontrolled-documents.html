<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h4 class="mb-0">Uncontrolled Document Repository</h4>
            <p class="text-muted mb-0" style="font-size: 13px">
              Documents stored here bypass the standard creation and approval workflow.
            </p>
          </div>
          <button class="btn btn-primary upload-doc-btn" (click)="openUploadModal()" *ngIf="canAdd">
            <i class="bi bi-upload me-1"></i> Upload Document
          </button>
        </div>

        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 mb-4">
            <app-ag-grid-wrapper
              [gridStyle]="{ width: '100%', height: '500px' }"
              [columnDefs]="columnDefs"
              [defaultColDef]="defaultColDef"
              [isSelectionRequired]="false"
              [autoSizeColumns]="true"
              [showDisplayOption]="false"
              [rowData]="documentsData"
              [pageSize]="pageSize"
              [pageSizeOptions]="[10, 20, 50, 100]"
              [totalRows]="totalRows"
              gridId="uncontrolledDocumentsGrid"
              (serverQuery)="GetAllDocuments($event)"
              (pageSizeChange)="onPageSizeChanged($event)"
              (cellClicked)="onActionClicked($event)"
            >
            </app-ag-grid-wrapper>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
