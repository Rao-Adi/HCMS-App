<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Training for SOP Documents</h3>
            <small class="text-muted">Training for SOP Documents</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Pending Authorization' }"
                (click)="selectedTab = 'Pending Authorization'"
              >
                Pending Authorization
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Authorized' }"
                (click)="selectedTab = 'Authorized'"
              >
                Authorized
              </button>
            </div>

            <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="status-box-leftColmd6-standard">
                <h3 class="PnlHeader">
                  {{ 'labels.Cabinet' | safeTranslate }}
                </h3>
                <br />
                <div class="row">
                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.DocumentType' | safeTranslate }} </label>
                    </div>
                    <div>
                      <app-document-type-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Division"
                        [(ngModel)]="selectedDocumentType"
                        (valueChange)="onDocumentTypeChange($event)"
                        width="250px"
                      >
                      </app-document-type-list>
                    </div>
                  </div>
                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Division' | safeTranslate }} </label>
                    </div>
                    <div class="Divtxtemployeeschright" style="width: 250px">
                      <div>
                        <app-division-list
                          valueKey="CODE"
                          labelKey="NAME"
                          placeholder="Select Division"
                          [(ngModel)]="selectedDivisions"
                          (valueChange)="onDepartmentsChange($event)"
                          width="250px"
                        >
                        </app-division-list>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Department' | safeTranslate }}</label>
                    </div>
                    <div>
                      <app-department-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Department"
                        [(ngModel)]="selectedDepartment"
                        (valueChange)="onDepartmentsChange($event)"
                        width="250px"
                      >
                      </app-department-list>
                    </div>
                  </div>

                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.SubDepartment' | safeTranslate }}</label>
                    </div>
                    <div>
                      <app-sub-department-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Department"
                        [(ngModel)]="selectedDepartment"
                        (valueChange)="onDepartmentsChange($event)"
                        width="250px"
                      >
                      </app-sub-department-list>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="status-box-leftColmd6-standard">
                <h3 class="PnlHeader">
                  {{ 'labels.Documents' | safeTranslate }}
                </h3>
                <br />
                <div class="row">
                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Authorization Status' | safeTranslate }} </label>
                    </div>
                    <div>
                      <app-document-type-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Division"
                        [(ngModel)]="selectedDocumentType"
                        (valueChange)="onDocumentTypeChange($event)"
                        width="250px"
                      >
                      </app-document-type-list>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Pending Authorization'">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  [columnDefs]="UploadColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [rowData]="rowData"
                  [pageSize]="pageSize"
                  [totalRows]="totalRows"
                  (serverQuery)="GetAllDocuments($event)"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Authorized'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  [columnDefs]="UploadedDocColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [rowData]="rowData"
                  [pageSize]="pageSize"
                  [totalRows]="totalRows"
                  (serverQuery)="GetAllUploadedDocuments($event)"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
