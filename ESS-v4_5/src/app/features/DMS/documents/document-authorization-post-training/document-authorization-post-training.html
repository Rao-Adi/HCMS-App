<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom"> 
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button d-inline-flex align-items-center gap-2"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Pending Authorization' }"
                (click)="onTabChange('Pending Authorization')" 
              >
                Pending Authorization
                <span class="badge rounded-pill bg-warning text-dark border shadow-sm font-monospace px-2 py-1" style="font-size: 11px">
                  {{ pendingCount }}
                </span>
              </button>
              <button
                class="tab-button d-inline-flex align-items-center gap-2"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Authorized' }"
                (click)="onTabChange('Authorized')"
              >
                Authorized
                <span class="badge rounded-pill bg-success text-white border shadow-sm font-monospace px-2 py-1" style="font-size: 11px">
                  {{ authorizedCount }}
                </span>
              </button>
              <button
                class="tab-button d-inline-flex align-items-center gap-2"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Rejected' }"
                (click)="onTabChange('Rejected')"
              >
                Rejected
                <span class="badge rounded-pill bg-danger text-white border shadow-sm font-monospace px-2 py-1" style="font-size: 11px">
                  {{ rejectedCount }}
                </span>
              </button>
            </div>

            <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="Master-box mb-4">
                <h3 class="PnlHeader">
                  {{ 'labels.Cabinet' | safeTranslate }}
                </h3>
                <div class="row">
                  <div class="col-lg-9 col-md-9 col-sm-9 mb-10">
                    <app-cabinet-structure-list 
                      [divisionCode]="selectedDivisions"
                      [departmentCode]="selectedDepartment"
                      [subDepartmentCode]="selectedSubDepartment"
                      [businessDomainCode]="selectedbusinessDomain"
                      (hierarchyChange)="onHierarchyChange($event)">
                    </app-cabinet-structure-list>
                  </div>
                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Document Type' | safeTranslate }} </label>
                    </div>
                    <div>
                      <app-document-type-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Document Type"
                        [(ngModel)]="selectedDocumentType"
                        (valueChange)="onDocumentTypeChange($event)"
                        width="250px"
                      >
                      </app-document-type-list>
                    </div>
                  </div>
                </div>
                  <div class="row mt-4">
                  <div class="col-lg-12 col-md-6 col-sm-3 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Authorization Status' | safeTranslate }} </label>
                    </div>
                    <div>
                      <nz-select
                        style="width: 250px"
                        [nzPlaceHolder]="'Select Filter'"
                        [(ngModel)]="selectedAuthorizationStatus"
                        (ngModelChange)="onAuthorizationStatusChange($event)"
                        nzAllowClear
                        nzShowSearch
                      >
                        <nz-option
                          *ngFor="let dep of authorizationStatues"
                          [nzValue]="dep.id"
                          [nzLabel]="dep.text"
                        >
                        </nz-option>
                      </nz-select>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row-space">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <h3 class="PnlHeader">
                  {{ 'labels.Documents' | safeTranslate }}
                </h3> 
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Pending Authorization'">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '450px' }"
                  [columnToggles]="columnToggles"
                  [columnDefs]="pendingAuthorizationColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [isSelectionRequired]="true"
                  [showDisplayOption]="true"
                  [autoSizeColumns]="true"
                  [rowData]="pendingAuthorizationData"
                  [pageSize]="pageSize"
                  [totalRows]="totalRows"
                  gridId="authorizedGrid"
                  (gridReady)="onGridReady($event)"
                  (pageSizeChange)="onPageSizeChanged($event)"
                  (serverQuery)="GetAllDocuments($event)"
                   (selectionChange)="onSelectionChange($event)"
                >
                  <div grid-actions class="grid-action-icons">
                    <button class="btn btn-success btn-sm btn-action" title="Approve" (click)="approve('APPROVED')"
                    [class.disabled]="!hasSelectedRows"
                    [disabled]="hasSelectedRows === false">
                      <i class="bi bi-check2-square"></i>  Approve
                    </button>

                    <button class="btn btn-danger btn-sm btn-action" title="Reject" (click)="approve('REJECTED')"
                    [class.disabled]="!hasSelectedRows"
                    [disabled]="hasSelectedRows === false">
                      <i class="bi bi-x-square"></i>  Reject
                    </button> 
                  </div>
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Authorized'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '450px' }"
                  [columnToggles]="columnToggles"
                  [columnDefs]="pendingAuthorizationColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [autoSizeColumns]="true"
                  [isSelectionRequired]="false"
                  [showDisplayOption]="true"
                  [rowData]="pendingAuthorizationData"
                  [pageSize]="pageSize"
                  [totalRows]="totalRows"
                  gridId="pendingAuthGrid"
                  (gridReady)="onGridReady($event)"
                  (pageSizeChange)="onPageSizeChanged($event)"
                  (serverQuery)="GetAllDocuments($event)"
                   (selectionChange)="onSelectionChange($event)"
                > 
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Rejected'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '450px' }"
                  [columnToggles]="columnToggles"
                  [columnDefs]="pendingAuthorizationColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [isSelectionRequired]="false"
                  [showDisplayOption]="true"
                  [autoSizeColumns]="true"
                  [rowData]="pendingAuthorizationData"
                  [pageSize]="pageSize"
                  [totalRows]="totalRows"
                  gridId="pendingAuthGrid"
                  (gridReady)="onGridReady($event)"
                  (pageSizeChange)="onPageSizeChanged($event)"
                  (serverQuery)="GetAllDocuments($event)"
                   (selectionChange)="onSelectionChange($event)"
                > 
                </app-ag-grid-wrapper>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
