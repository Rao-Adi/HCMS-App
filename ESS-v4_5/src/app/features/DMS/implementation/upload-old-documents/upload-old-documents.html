<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom"> 
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Upload' }"
                (click)="selectedTab = 'Upload'"
              >
                Upload
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'UploadedDocuments' }"
                (click)="selectedTab = 'UploadedDocuments'"
              >
                Uploaded Documents
              </button>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Upload'">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-upload-documents></app-upload-documents>
 
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'UploadedDocuments'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-uploaded-documents>
                </app-uploaded-documents>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
