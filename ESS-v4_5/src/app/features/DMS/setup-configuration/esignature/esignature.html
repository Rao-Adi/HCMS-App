<div class="container-fluid">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="card-custom"> 
          <div class="col-lg-12 col-md-12 col-sm-12">
            <div class="main-content d-flex flex-column min-vw-0">
              <!-- <div class="custom-tab-container">
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'TrainingPoliciy' }"
                  (click)="selectedTab = 'TrainingPoliciy'"
                >
                  Training Policiy
                </button>
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'DocumentReview' }"
                  (click)="selectedTab = 'DocumentReview'"
                >
                  Document Review
                </button>
              </div> -->

              <div class="row row-space" *ngIf="selectedTab === 'TrainingPoliciy'">
                <div class="col-lg-12 col-md-12 col-sm-12">
                  <div class="justify-content-center align-items-center signature-container">
                    <nz-color-picker
                      [(ngModel)]="penColor"
                      nzFormat="hex"
                      (ngModelChange)="onColorChange($event)"
                    ></nz-color-picker>
                    <canvas #canvas class="signature-canvas"></canvas>
                  </div>
                  <div class="d-flex justify-content-center">
                    <div class="signature-toolbar btn-group gap-2 mt-2">
                      <button class="btn btn-sm btn-primary" nz-button (click)="undo()"
                      [disabled]="!this.canAdd">
                        Undo
                      </button>
                      <button class="btn btn-sm btn-primary" nz-button (click)="redo()"
                      [disabled]="!this.canAdd">
                        Redo
                      </button>
                      <button
                        class="btn btn-sm btn-primary"
                        nz-button
                        nzType="default"
                        [disabled]="!this.canAdd"
                        (click)="clear()"
                      >
                        Clear
                      </button>
                      <button
                        class="btn btn-sm btn-primary"
                        nz-button
                        nzType="primary"
                        [disabled]="!this.canAdd"
                        (click)="save()"
                      >
                        Save
                      </button>

                      <!-- Upload Button -->
                      <button
                        class="btn btn-sm btn-secondary"
                        nz-button
                        [disabled]="!this.canAdd"
                        (click)="fileInput.click()"
                      >
                        Upload
                      </button>
                    </div>
                    <!-- Hidden File Input -->
                    <input
                      #fileInput
                      type="file"
                      accept="image/png"
                      hidden
                      (change)="onSignatureUpload($event)"
                    />
                  </div>
                </div>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'DocumentReview'">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <nz-upload
                    class="avatar-uploader"
                    nzAction="https://www.mocky.io/v2/5cc8019d300000980a055e76"
                    nzName="avatar"
                    nzListType="picture-card"
                    [nzShowUploadList]="false"
                    [nzBeforeUpload]="beforeUpload"
                    (nzChange)="handleChange($event)"
                  >
                    @if (!avatarUrl) {
                      <nz-icon class="upload-icon" [nzType]="loading ? 'loading' : 'plus'" />
                      <div class="ant-upload-text">Upload</div>
                    } @else {
                      <img [src]="avatarUrl" style="width: 100%" />
                    }
                  </nz-upload>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
