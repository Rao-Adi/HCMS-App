<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom mb-4">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Document Template</h3>
            <small class="text-muted">Document Template</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="row mb-4">
              <div class="col-lg-4 col-md-4 col-sm-4 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.Document Type' | safeTranslate }} </label>
                </div>
                <div class="form-group">
                  <div>
                    <app-document-type-list
                      valueKey="CODE"
                      labelKey="NAME"
                      placeholder="Select Document Type"
                      [(ngModel)]="selectedDocumentType"
                      (valueChange)="onDocumentTypeChange($event)"
                      width="250px"
                    >
                    </app-document-type-list>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-cabinet-structure-list (hierarchyChange)="onHierarchyChange($event)">
                </app-cabinet-structure-list>
              </div>
            </div>
            <br />
            <div class="row">
              <!-- <div class="col-lg-3 col-md-3 col-sm-3">
                <div class="PnlHeading">
                  <label>{{ 'labels.Template Name' | safeTranslate }} </label>
                </div>
                <input
                  maxlength="50"
                  type="text"
                  [(ngModel)]="templateName"
                  class="form-control input-sm"
                  style="width: 250px"
                />
              </div> -->
              <div class="col-lg-3 col-md-3 col-sm-3">
                <div class="PnlHeading">
                  <label>{{ 'labels.Template Type' | safeTranslate }} </label>
                </div>
                <nz-select
                  style="width: 250px"
                  [(ngModel)]="selectedTemplateType"
                  nzPlaceHolder="Select Template Type"
                  nzAllowClear
                  nzShowSearch
                >
                  <nz-option
                    *ngFor="let dep of templateTypes"
                    [nzValue]="dep.id"
                    [nzLabel]="dep.text"
                  >
                  </nz-option>
                </nz-select>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3">
                <div class="PnlHeading">
                  <label>{{ 'labels.Default Template' | safeTranslate }} </label>
                </div>
                <label nz-checkbox [(ngModel)]="isDefaultTemplate"></label>
              </div>
            </div>
            <br />
            <div class="row">
              <!-- Show Rich Text Editor only for HTML template type (id: '3') -->
              <ng-container *ngIf="selectedTemplateType === '3'">
                <div class="col-lg-12 col-md-12 col-sm-12 mb-10 mt-3">
                  <div class="PnlHeading">
                    <label>{{ 'labels.Template' | safeTranslate }} </label>
                  </div>
                  <div class="editor-wrapper mb-4">
                    <app-dmsrich-text-edit
                      [editorStyle]="{ width: '100%', height: '350px' }"
                      [contentHtml]="templateHtml"
                      (contentHtmlChange)="templateHtml = $event"
                    ></app-dmsrich-text-edit>
                  </div>
                </div>
              </ng-container>

              <!-- Show File Upload for Word / PDF template types (id: '1' or '2') -->
              <ng-container *ngIf="selectedTemplateType === '1' || selectedTemplateType === '2'">
                <div class="col-lg-12 col-md-12 col-sm-12 mb-10 mt-3">
                  <div class="PnlHeading">
                    <label>Choose File (DOCX/PDF)</label>
                  </div>
                  <input type="file" class="form-control input-sm" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx" style="width: 350px" />
                </div>
              </ng-container>
            </div>
            
            <br />
            <div class="justify-content-center">
              <button nz-button nzType="primary" (click)="saveTemplate($event)">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
