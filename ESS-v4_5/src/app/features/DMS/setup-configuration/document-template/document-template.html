<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom mb-4">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Document Template</h3>
            <small class="text-muted">Document Template</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="row mb-4">
              <div class="col-lg-4 col-md-4 col-sm-4 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.DocumentType' | safeTranslate }} </label>
                </div>
                <div class="form-group">
                  <div>
                    <app-document-type-list
                      valueKey="CODE"
                      labelKey="NAME"
                      placeholder="Select DocumentType"
                      [(ngModel)]="selectedDocumentType"
                      (valueChange)="onDocumentTypeChange($event)"
                      width="250px"
                    >
                    </app-document-type-list>
                  </div>
                  <!-- <div class="row">
                    <nz-select
                      nzMode="multiple"
                      nzPlaceHolder="Select users"
                      nzAllowClear
                      nzShowSearch
                      nzServerSearch
                      [(ngModel)]="selectedUser"
                      (nzOnSearch)="onSearch($event)"
                    >
                      @if (!loading) { @for (o of optionList; track o) {
                      <nz-option [nzValue]="o" [nzLabel]="o"></nz-option>
                      } } @else {
                      <nz-option nzDisabled nzCustomContent>
                        <nz-icon nzType="loading" class="loading-icon" />
                        Loading Data...
                      </nz-option>
                      }
                    </nz-select>
                  </div> -->
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <div class="row">
                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Division' | safeTranslate }} </label>
                    </div>
                    <div class="Divtxtemployeeschright" style="width: 250px">
                      <div>
                        <app-division-list
                          valueKey="CODE"
                          labelKey="NAME"
                          placeholder="Select Division"
                          [(ngModel)]="selectedDivisions"
                          (valueChange)="onDivisionChange($event)"
                          width="250px"
                        >
                        </app-division-list>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.Department' | safeTranslate }}</label>
                    </div>
                    <div>
                      <app-department-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select Department"
                        [division]="selectedDivisions"
                        [(ngModel)]="selectedDepartment"
                        (valueChange)="onDepartmentsChange($event)"
                        width="250px"
                      >
                      </app-department-list>
                    </div>
                  </div>

                  <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                    <div class="PnlHeading">
                      <label>{{ 'labels.SubDepartment' | safeTranslate }}</label>
                    </div>
                    <div>
                      <app-sub-department-list
                        valueKey="CODE"
                        labelKey="NAME"
                        placeholder="Select SubDepartment"
                        [department]="selectedDepartment"
                        [(ngModel)]="selectedSubDepartment"
                        width="250px"
                      >
                      </app-sub-department-list>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <br />
            <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.Template' | safeTranslate }} </label>
                </div>
                <div>
                  <div class="editor-wrapper mb-4">
                    <app-dmsrich-text-edit></app-dmsrich-text-edit>
                  </div>
                </div>
                <br />
                <div class="justify-content-center">
                  <button nz-button nzType="primary" (click)="saveTemplate($event)">Save</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
