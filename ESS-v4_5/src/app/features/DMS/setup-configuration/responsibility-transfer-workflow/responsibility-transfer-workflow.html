<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="main-content d-flex flex-column min-vw-0">
        <div class="row row-space">
          <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="status-box-leftColmd6-standard">
              <h3 class="PnlHeader">
                {{ 'labels.Standard Approval Workflow' | safeTranslate }}
              </h3>
              <br />
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 mb-10">
                  <app-editable-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '500px' }"
                    class="ag-theme-alpine"
                    [gridId]="'employee-planning-grid'"
                    [config]="gridConfig"
                    [rowData]="manualUserData"
                    [pinnedTopRowData]="pinnedTopRowDataPlanning"
                    [isSelectionRequired]="true"
                    (rowAdded)="onRowAdded($event)"
                    (rowUpdated)="onRowUpdated($event)"
                    (rowDeleted)="onRowDeleted($event)"
                    (cellValueChanged)="onCellValueChanged($event)"
                    (selectionChanged)="onSelectionChanged($event)"
                    (gridReady)="onGridReady($event)"
                  >
                  </app-editable-ag-grid-wrapper>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
