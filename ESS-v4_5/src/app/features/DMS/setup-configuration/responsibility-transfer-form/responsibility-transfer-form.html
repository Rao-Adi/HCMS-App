<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Responsibility Transfer Form</h3>
            <small class="text-muted">Responsibility Transfer Form</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Request' }"
                (click)="onTabChange('Request')"
              >
                Request
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Approvals' }"
                (click)="onTabChange('Approvals')"
              >
                Approvals
              </button>
            </div>
            <div class="row row-space" *ngIf="selectedTab === 'Request'">
              <div class="row row-space">
                <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="status-box-leftColmd6-standard">
                    <div class="row">
                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Employee (From)' | safeTranslate }} </label>
                        </div>
                        <div>
                          <nz-select
                            style="width: 200px"
                            [nzPlaceHolder]="'Select Employee(From)'"
                            [(ngModel)]="selectedEmployeeFrom"
                            (ngModelChange)="onEmployeeFromChange($event)"
                            nzAllowClear
                            nzShowSearch
                          >
                            <nz-option
                              *ngFor="let dep of employees"
                              [nzValue]="dep.CODE"
                              [nzLabel]="dep.NAME"
                            >
                            </nz-option>
                          </nz-select>
                        </div>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Employee (To)' | safeTranslate }} </label>
                        </div>
                        <div class="Divtxtemployeeschright" style="width: 250px">
                          <div>
                            <nz-select
                              style="width: 200px"
                              [nzPlaceHolder]="'Select Employee(To)'"
                              [(ngModel)]="selectedEmployeeTo"
                              nzAllowClear
                              nzShowSearch
                            >
                              <nz-option
                                *ngFor="let dep of filteredEmployeesTo"
                                [nzValue]="dep.CODE"
                                [nzLabel]="dep.NAME"
                              >
                              </nz-option>
                            </nz-select>
                          </div>
                        </div>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Reason For Transfer' | safeTranslate }}</label>
                        </div>
                        <div>
                          <nz-select
                            style="width: 200px"
                            [nzPlaceHolder]="'Select Reason For Transfer'"
                            [(ngModel)]="selectedReasonForTransfer"
                            nzAllowClear
                            nzShowSearch
                          >
                            <nz-option
                              *ngFor="let dep of reasonForTransfer"
                              [nzValue]="dep.CODE"
                              [nzLabel]="dep.NAME"
                            >
                            </nz-option>
                          </nz-select>
                        </div>
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <span class="d-flex">Effective Date (From)</span>
                        <nz-date-picker
                          [nzPlaceHolder]="'Select Date'"
                          [(ngModel)]="selectedEffectiveDateFrom"
                          style="width: 50%"
                          [nzFormat]="'dd/MMM/yyyy'"
                        >
                        </nz-date-picker>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <span class="d-flex">Effective Date (To)</span>
                        <nz-date-picker
                          [nzPlaceHolder]="'Select Date'"
                          [(ngModel)]="selectedEffectiveDateTo"
                          [nzDisabled]="isPermanentTransfer"
                          style="width: 50%"
                          [nzFormat]="'dd/MMM/yyyy'"
                        >
                        </nz-date-picker>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10 pt-4">
                        <label
                          nz-checkbox
                          [(ngModel)]="isPermanentTransfer"
                          (ngModelChange)="onPermanentTransferChange($event)"
                        >
                          Permanent Transfer
                        </label>
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-12 col-md-12 col-sm-6 mb-10">
                        <input
                          type="file"
                          #fileInput
                          hidden="true"
                          (change)="onFileSelected($event)"
                          accept=".jpg,.png,.pdf"
                        />
                        <button mat-raised-button color="primary" (click)="fileInput.click()">
                          Choose File
                        </button>
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-12 col-md-12 col-sm-6 mb-10">
                        <span class="d-flex">Remarks <span class="text-danger ml-1">*</span></span>
                        <textarea
                          style="width: 50%"
                          rows="4"
                          nz-input
                          [(ngModel)]="remarks"
                        ></textarea>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <br />
              <div class="justify-content-center pt-4 d-flex gap-2">
                <button nz-button nzType="primary" (click)="submitRequest($event)">Submit</button>
                <button nz-button nzType="default" (click)="cancel()">Cancel</button>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Approvals'">
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 mb-4">
                  <div class="PnlHeading">
                    <label>{{ 'labels.Pending Approvals On My End' | safeTranslate }} </label>
                  </div>
                </div>
              </div>
              <div class="row mb-4">
                <div class="col-lg-3 col-md-3 col-sm-6">
                  <div class="PnlHeading">
                    <label>Status</label>
                  </div>
                  <nz-select
                    style="width: 100%"
                    [(ngModel)]="selectedStatus"
                    (ngModelChange)="selectStatus($event)"
                    nzPlaceHolder="Select Status"
                  >
                    <nz-option *ngFor="let s of statues" [nzValue]="s.id" [nzLabel]="s.text"></nz-option>
                  </nz-select>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-4">
                  <app-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '350px' }"
                    [columnDefs]="pendingRequestApprovalColumnDefs"
                    [defaultColDef]="defaultColDef"
                    [rowData]="pendingApprovalData"
                    [isSelectionRequired]="selectedStatus === '1'"
                    [showDisplayOption]="true"
                    [totalRows]="totalPendingApprovals"
                    [pageSize]="selectedPageSize"
                    gridId="myRequestPendingApprovalGrid"
                    (pageSizeChange)="onPageSizeChanged($event)"
                    (serverQuery)="GetAllResponsibilityTransferForms($event)"
                    (selectionChange)="onSelectionChange($event)"
                  >
                    <div grid-actions class="grid-action-icons" *ngIf="selectedStatus === '1'">
                      <button class="grid-icon-btn" title="Approve" [disabled]="!hasSelectedRows" [class.disabled]="!hasSelectedRows" >
                        <i class="bi bi-check2-square"></i>
                      </button>
                      <button class="grid-icon-btn" title="Reject" [disabled]="!hasSelectedRows" [class.disabled]="!hasSelectedRows"  >
                        <i class="bi bi-x-square"></i>
                      </button>
                      <button class="grid-icon-btn" title="Revert" [disabled]="!hasSelectedRows" [class.disabled]="!hasSelectedRows" >
                        <i class="bi bi-reply"></i>
                      </button>
                    </div>
                  </app-ag-grid-wrapper>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
