<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Responsibility Transfer Form</h3>
            <small class="text-muted">Responsibility Transfer Form</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Request' }"
                (click)="selectedTab = 'Request'"
              >
                Request
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Approvals' }"
                (click)="selectedTab = 'Approvals'"
              >
                Approvals
              </button>
            </div>
            <div class="row row-space" *ngIf="selectedTab === 'Request'">
              <div class="row row-space">
                <div class="row-space col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <div class="status-box-leftColmd6-standard">
                    <div class="row">
                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Employee (From)' | safeTranslate }} </label>
                        </div>
                        <div>
                          <nz-select
                            style="width: 200px"
                            [nzPlaceHolder]="'Select Employee(From)'"
                            [(ngModel)]="selectedEmployeeFrom"
                            nzAllowClear
                            nzShowSearch
                          >
                            <nz-option
                              *ngFor="let dep of employees"
                              [nzValue]="dep.CODE"
                              [nzLabel]="dep.NAME"
                            >
                            </nz-option>
                          </nz-select>
                        </div>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Employee (To)' | safeTranslate }} </label>
                        </div>
                        <div class="Divtxtemployeeschright" style="width: 250px">
                          <div>
                            <nz-select
                              style="width: 200px"
                              [nzPlaceHolder]="'Select Employee(To)'"
                              [(ngModel)]="selectedEmployeeTo"
                              nzAllowClear
                              nzShowSearch
                            >
                              <nz-option
                                *ngFor="let dep of employees"
                                [nzValue]="dep.CODE"
                                [nzLabel]="dep.NAME"
                              >
                              </nz-option>
                            </nz-select>
                          </div>
                        </div>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <div class="PnlHeading">
                          <label>{{ 'labels.Reason For Transfer' | safeTranslate }}</label>
                        </div>
                        <div>
                          <nz-select
                            style="width: 200px"
                            [nzPlaceHolder]="'Select Reason For Transfer'"
                            [(ngModel)]="selectedReasonForTransfer"
                            nzAllowClear
                            nzShowSearch
                          >
                            <nz-option
                              *ngFor="let dep of employees"
                              [nzValue]="dep.CODE"
                              [nzLabel]="dep.NAME"
                            >
                            </nz-option>
                          </nz-select>
                        </div>
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <span class="d-flex">Effective Date (From)</span>
                        <nz-date-picker
                          [nzPlaceHolder]="'Select Date'"
                          [(ngModel)]="selectedEffectiveDateFrom"
                          style="width: 50%"
                          [nzFormat]="'dd-MMM-yyyy'"
                        >
                        </nz-date-picker>
                      </div>

                      <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                        <span class="d-flex">Effective Date (To)</span>
                        <nz-date-picker
                          [nzPlaceHolder]="'Select Date'"
                          [(ngModel)]="selectedEffectiveDateTo"
                          style="width: 50%"
                          [nzFormat]="'dd-MMM-yyyy'"
                        >
                        </nz-date-picker>
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-12 col-md-12 col-sm-6 mb-10">
                        <input
                          type="file"
                          #fileInput
                          hidden="true"
                          (change)="onFileSelected($event)"
                          accept=".jpg,.png,.pdf"
                        />
                        <button mat-raised-button color="primary" (click)="fileInput.click()">
                          Choose File
                        </button>
                         

                        <!-- <nz-upload
                          [nzFileList]="fileList"
                          [nzBeforeUpload]="beforeUpload"
                          [nzShowUploadList]="true"
                          (nzChange)="handleChange($event)"
                        >
                          <button nz-button>
                            <nz-icon nzType="upload"></nz-icon>
                            Click to Upload
                          </button>
                        </nz-upload> -->
                      </div>
                    </div>
                    <div class="row pt-4">
                      <div class="col-lg-12 col-md-12 col-sm-6 mb-10">
                        <span class="d-flex">Remarks</span>
                        <textarea rows="4" nz-input [(ngModel)]="remarks"></textarea>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <br />
              <div class="justify-content-center">
                <button nz-button nzType="primary" (click)="saveTemplate($event)">Save</button>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Approvals'">
              <div class="row">
                <div class="col-lg-3 col-md-3 col-sm-6 mb-10">
                  <div class="PnlHeading">
                    <label>{{ 'labels.Status' | safeTranslate }} </label>
                  </div>
                  <div>
                    <nz-select
                      style="width: 250px"
                      [(ngModel)]="selectedAuthorityType"
                      nzPlaceHolder="Select Status"
                      (ngModelChange)="onAuthorityTypeChange($event)"
                      nzAllowClear
                      nzShowSearch
                    >
                      <nz-option
                        *ngFor="let dep of statues"
                        [nzValue]="dep.id"
                        [nzLabel]="dep.text"
                      >
                      </nz-option>
                    </nz-select>
                  </div>
                </div>
              </div>
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-4">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '350px' }"
                  [columnDefs]="pendingRequestApprovalColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [rowData]="pendingApprovalData"
                  [isSelectionRequired]="true"
                  [totalRows]="totalPendingApprovals"
                  [pageSize]="selectedPageSize"
                  gridId="myRequestPendingApprovalGrid"
                  (pageSizeChange)="onPageSizeChanged($event)"
                  (serverQuery)="GetAllPendingApprovalRequests($event)"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
