<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Cabinet Structure</h3>
            <small class="text-muted">Cabinet Structure</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div _ngcontent-ng-c4214321369="" class="main-content d-flex flex-column min-vw-0">
            <div class="custom-tab-container">
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Level1' }"
                (click)="selectedTab = 'Level1'"
              >
                Level 1
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Level2' }"
                (click)="selectedTab = 'Level2'"
              >
                Level 2
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Level3' }"
                (click)="selectedTab = 'Level3'"
              >
                Level 3
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'Level4' }"
                (click)="selectedTab = 'Level4'"
              >
                Level 4
              </button>
              <button
                class="tab-button"
                tabindex="0"
                [ngClass]="{ 'active-tab': selectedTab === 'DocumentType' }"
                (click)="selectedTab = 'DocumentType'"
              >
                Document Type
              </button>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Level1'">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  class="ag-theme-alpine"
                  [columnDefs]="divisionColumnDefs"
                  [rowData]="divisionData"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Level2'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  class="ag-theme-alpine"
                  [rowData]="departmentData"
                  [columnDefs]="departmentColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>
            <div class="row row-space" *ngIf="selectedTab === 'Level3'">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  class="ag-theme-alpine"
                  [columnDefs]="subDepartmentColumnDefs"
                  [rowData]="subDepartmentData"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'Level4'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  class="ag-theme-alpine"
                  [rowData]="businessDomainData"
                  [columnDefs]="businessdomainColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>

            <div class="row row-space" *ngIf="selectedTab === 'DocumentType'">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '250px' }"
                  class="ag-theme-alpine"
                  [rowData]="documentTypeData"
                  [columnDefs]="documentTypeColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
