<div class="container-fluid">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="card-custom">
          <div class="clearfix">
            <div class="pull-left">
              <h3 class="mt-0">Misc Policies</h3>
              <small class="text-muted">Misc Policies</small>
            </div>
          </div>
          <br />
          <hr />
          <div class="col-lg-12 col-md-12 col-sm-12">
            <div class="main-content d-flex flex-column min-vw-0">
              <div class="custom-tab-container">
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'TrainingPoliciy' }"
                  (click)="selectedTab = 'TrainingPoliciy'"
                >
                  Training Policiy
                </button>
                <button
                  class="tab-button"
                  tabindex="0"
                  [ngClass]="{ 'active-tab': selectedTab === 'DocumentReview' }"
                  (click)="selectedTab = 'DocumentReview'"
                >
                  Document Review
                </button>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'TrainingPoliciy'">
                <div class="col-lg-12 col-md-12 col-sm-12">
                  <app-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '250px' }"
                    class="ag-theme-alpine"
                    [columnDefs]="UploadColumnDefs"
                    [rowData]="rowData"
                    [defaultColDef]="defaultColDef"
                    [overlayNoRowsTemplate]="noRowsOverlay"
                    [pagination]="false"
                  >
                  </app-ag-grid-wrapper>
                </div>
              </div>

              <div class="row row-space" *ngIf="selectedTab === 'DocumentReview'">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                  <app-ag-grid-wrapper
                    [gridStyle]="{ width: '100%', height: '250px' }"
                    class="ag-theme-alpine"
                    [rowData]="documentReviewRowData"
                    [columnDefs]="UploadedDocColumnDefs"
                    [defaultColDef]="defaultColDef"
                    [overlayNoRowsTemplate]="noRowsOverlay"
                    [pagination]="false"
                  >
                  </app-ag-grid-wrapper>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
