<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Document Attribute</h3>
            <small class="text-muted">Dynamic document attribute management</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="row mb-4">
              <div class="col-lg-4 col-md-4 col-sm-4 mb-10">
                <div class="PnlHeading">
                  <label>{{ 'labels.DocumentType' | safeTranslate }} </label>
                </div>
                <div>
                  <app-document-type-list
                    valueKey="CODE"
                    labelKey="NAME"
                    placeholder="Select DocumentType"
                    [(ngModel)]="selectedDocumentType"
                    (valueChange)="onDocumentTypeChange($event)"
                    width="250px"
                  >
                  </app-document-type-list>
                </div>
              </div>
            </div>

            <div class="row row-space">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-editable-ag-grid-wrapper
                  style="width: 100%; height: 550px"
                  class="ag-theme-alpine"
                  [gridId]="'employee-planning-grid'"
                  [config]="gridConfig"
                  [rowData]="documentAttributeData"
                  [pinnedTopRowData]="pinnedTopRowDataPlanning"
                  (rowAdded)="onRowAdded($event)"
                  (rowUpdated)="onRowUpdated($event)"
                  (rowDeleted)="onRowDeleted($event)"
                  (cellValueChanged)="onCellValueChanged($event)"
                  (selectionChanged)="onSelectionChanged($event)"
                  (gridReady)="onGridReady($event)"
                  (actionClicked)="handleGridAction($event)"
                >
                </app-editable-ag-grid-wrapper>

                <!-- <app-ag-grid-wrapper
                  [gridStyle]="{ width: '100%', height: '550px' }"
                  [columnDefs]="documentAttributeColumnDefs"
                  [defaultColDef]="defaultColDef"
                  [rowData]="rowDataWithNewRow"
                  [pageSize]="selectedPageSize"
                  gridId="documentTypeGrid"
                  (pageSizeChange)="onPageSizeChanged($event)"
                  [totalRows]="totalCount"
                  (serverQuery)="loadBusinessDomains($event)"
                  (rowEdited)="onRowEdited($event)"
                  (cellClicked)="onGridCellClicked($event)"
                >
                </app-ag-grid-wrapper> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
