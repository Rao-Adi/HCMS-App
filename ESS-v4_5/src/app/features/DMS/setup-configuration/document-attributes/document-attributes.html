<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="card-custom">
        <div class="clearfix">
          <div class="pull-left">
            <h3 class="mt-0">Document Attribute</h3>
            <small class="text-muted">Dynamic document attribute management</small>
          </div>
        </div>
        <br />
        <hr />
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="main-content d-flex flex-column min-vw-0">
            <div class="row row-space">
              <div class="col-lg-12 col-md-12 col-sm-12">
                <app-ag-grid-wrapper
                  style="width: 100%; height: 550px"
                  class="ag-theme-alpine"
                  [apiUrl]="uploadApiUrl"
                  [columnDefs]="UploadColumnDefs"
                  [rowData]="rowData"
                  [defaultColDef]="defaultColDef"
                  [overlayNoRowsTemplate]="noRowsOverlay"
                  [pagination]="true"
                  [pageSize]="10"
                >
                </app-ag-grid-wrapper>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
